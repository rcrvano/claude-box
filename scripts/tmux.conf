# claude-box: forward the WINDOW NAME (set by claude-notify) into the terminal title
# ttyd -> into the browser tab title; pass the bell through to the client.
# Why window_name and not pane_title: pane_title always follows the application's
# OSC title, so after `done` Claude instantly overwrites our ✅. The application
# cannot touch window_name with allow-rename/automatic-rename off — the marker stays.
set -g set-titles on
# Tab title = our marker (window_name: 🟢/🟡/⏳, untouched by the application)
# + Claude's own title (pane_title — set by Claude via OSC). The marker is on the
# left so it survives truncation in a narrow tab.
set -g set-titles-string '#{window_name} · #{pane_title}'
set -g allow-rename off
set -g automatic-rename off
set -g monitor-bell on
set -g bell-action any

# Mouse: web terminal = xterm.js -> tmux -> claude. Without mouse on, the wheel reaches
# Claude as arrow keys (scrolls input history) instead of scrolling the scrollback dialog.
set -g mouse on

# Clipboard: select with the mouse -> tmux copies (default: copy-selection-and-cancel)
# and sends OSC 52 out to xterm.js, and the frontend (index.html) puts it on the system clipboard.
# terminal-features ...:clipboard tells tmux that the outer terminal supports OSC 52
# (without this set-clipboard stays silent, since xterm-256color does not always advertise Ms).
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# The default 2000 lines run out on long dialogs — the top of the scrollback gets cut off.
set -g history-limit 50000
