<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>claude-box</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22claude-box%22%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230E1116%22%2F%3E%20%3Cg%20fill%3D%22none%22%20stroke%3D%22%235B5BD6%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%20%3Cpath%20d%3D%22M19%2014%20H13%20V50%20H19%22%2F%3E%20%3Cpath%20d%3D%22M45%2014%20H51%20V50%20H45%22%2F%3E%20%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(20%2020)%20scale(0.024)%22%3E%20%3Cpath%20fill%3D%22%23D97757%22%20d%3D%22M474.0000305%2C1000L449%2C981l-14.0000305-31.000061L449%2C888l16-80%0D%20l13-63.999939L490%2C665l7.0000305-26L496%2C637l-4.9999695%2C1L431%2C720l-91%2C123l-72%2C76l-17%2C7.000061L221%2C911l3-28l17-24.000061%0D%20l99-126.9998779L400.0000305%2C653L439%2C608l-1-6h-2l-264%2C172L125%2C780l-21-19l3-31l10-10l79-55l197-110l3-10l-3-5h-9.9999695%0D%20l-33.000061-2L238%2C535l-97-4l-95-5l-24-5L0%2C491.0000305L2%2C476l20-12.9999695L51%2C465l63%2C5l94.9999847%2C6L278%2C480.0000305l102%2C11h16%0D%20L398%2C484l-5-3.9999695L389.0000305%2C476L290%2C410l-106-70l-56-41l-30-21l-15-19l-6-42l27-30l37%2C3l9%2C1.9999847L187%2C221l79%2C61l104%2C77%0D%20l15%2C12l7-4.0000305V364l-7-11l-56-102l-60-104l-27-43l-7-26c-2.6666565-9-4-19-4-30.0000038L262%2C6.000042L279%2C0l42%2C6.000042%0D%20l17.0000305%2C15L364%2C80l41%2C93l65%2C126l19%2C38l10%2C34l3.9999695%2C11H510v-6l5-72l10-87l10-112l3-32l16-37.999958l31-20l24%2C11%0D%20l20%2C28.9999619L626%2C73l-11%2C77l-24%2C121l-15%2C82h9l10-11l41-54l69-86l30-34l36-38l23-18h43l31%2C47l-14%2C49l-44%2C56l-37%2C47l-53%2C71%0D%20l-32.000061%2C57L691%2C443h7.000061L817%2C417.0000305l64.999939-11L958%2C393l35%2C16l4%2C16l-14.000061%2C34L901%2C479l-96%2C19l-143%2C34l-2%2C1l2%2C3%0D%20l64%2C6l28%2C2h68l126.000061%2C9L981%2C575l19%2C26l-3%2C21l-51%2C25l-68-16l-160-38l-54-13h-8v4l46%2C45l83%2C75l105 <!-- xterm is vendored locally (vendor/), inlined into this file at build time -->
<!-- (build-index.js): no CDN — the terminal has shell access, third-party JS = risk. -->
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #terminal  { position: fixed; inset: 0 0 24px 0; padding: 2px; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 24px;
    box-sizing: border-box; padding: 0 8px;
    background: #0b0b0b; border-top: 1px solid #1c1c1c; color: #8a9aa0;
    font: 11px/24px Menlo, Consolas, "DejaVu Sans Mono", monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none;
  }
  #bar .hot  { color: #ff5f5f; font-weight: 600; }
  #bar .warn { color: #ffb454; font-weight: 600; }
  /* Hide the xterm scrollbar — we scroll via tmux (mouse on / copy-mode). */
  .xterm-viewport { scrollbar-width: none; }              /* Firefox */
  .xterm-viewport::-webkit-scrollbar { display: none; }   /* WebKit  */
</style>
</head>
<body>
<div id="terminal"></div>
<div id="bar">—</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script>
(function () {
  'use strict';

  // --- ttyd 1.7.x wire protocol ---
  var SRV = { OUTPUT: '0', TITLE: '1', PREFS: '2' };
  var CLI = { INPUT: '0', RESIZE: '1' /* PAUSE:'2', RESUME:'3' — flow control, later */ };
  var enc = new TextEncoder(), dec = new TextDecoder();

  var loc  = window.location;
  var path = loc.pathname.replace(/[/]+$/, '');                 // base path without trailing /

  // Deep-link: outward a clean ?id=<token>, while ttyd (flag -a) receives ?arg=<token>.
  // So the user sees "id" in the address bar, while the claude-web-menu command gets it
  // as a regular argument. (?arg= is also accepted — backward compatibility.)
  var params  = new URLSearchParams(loc.search);
  var newName = params.get('new');                       // from the launcher: create a session
  var deepId  = params.get('id') || params.get('arg') || '';
  var wsArg   = (newName !== null) ? ('new:' + newName) : deepId;   // new:<name> or token
  var wsQuery = wsArg ? ('?arg=' + encodeURIComponent(wsArg)) : '';

  var wsUrl    = (loc.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + loc.host + path + '/ws' + wsQuery;
  var tokenUrl = loc.protocol + '//' + loc.host + path + '/token';

  var el = document.getElementById('terminal');
  var term = new Terminal({
    cursorBlink: true,
    fontFamily: 'Menlo, Consolas, "DejaVu Sans Mono", monospace',
    fontSize: 14,
    scrollback: 0,            // tmux keeps its own history; xterm scrollback not needed
    allowProposedApi: true
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(el);
  fit.fit();

  // Tab title + status indicator. tmux sends the window name (🟢/🟡/⏳ marker):
  // as an OSC in the stream (xterm -> onTitleChange) and/or as SRV.TITLE over the socket.
  // We keep the "raw" title and render it taking tab VISIBILITY into account:
  //   waiting (🟡) blinks 🟡↔🟤 ONLY while the tab is hidden and hasn't been opened during
  //   this wait; opening/focusing the tab -> the yellow marker is cleared. ⏳ and 🟢 are static.
  var rawTitle = document.title || 'claude-box';
  var lastState = null;
  var ackWaiting = false;            // wait already seen -> stop nagging
  var blinkTimer = null, blinkOn = true;
  var MARKS = ['🟢','🟡','🟤','⏳'];
  function stateOf(t){ if(!t) return null;
    if(t.indexOf('🟢')===0) return 'done';                          // 🟢 finished
    if(t.indexOf('🟡')===0 || t.indexOf('🟤')===0) return 'waiting'; // 🟡/🟤 waiting for input
    if(t.indexOf('⏳')===0) return 'working';                        // ⏳ working
    return null; }
  function stripMark(t){ for(var i=0;i<MARKS.length;i++){ if(t.indexOf(MARKS[i])===0) return t.slice(MARKS[i].length).replace(/^\s+/,''); } return t; }
  function stopBlink(){ if(blinkTimer){ clearInterval(blinkTimer); blinkTimer=null; } }
  function renderTitle(){
    if(stateOf(rawTitle)==='waiting'){
      if(!document.hidden){ ackWaiting=true; stopBlink(); document.title=stripMark(rawTitle); return; } // opened -> clear yellow
      if(ackWaiting){ stopBlink(); document.title=stripMark(rawTitle); return; }                        // already seen -> don't blink
      var body=stripMark(rawTitle);
      if(!blinkTimer){ blinkOn=true; blinkTimer=setInterval(function(){ blinkOn=!blinkOn; document.title=(blinkOn?'🟡':'🟤')+' '+body; }, 600); }
      document.title=(blinkOn?'🟡':'🟤')+' '+body;
      return;
    }
    stopBlink(); ackWaiting=false; document.title=rawTitle;   // ⏳ / 🟢 / no marker — as is
  }
  function setTitle(t){
    rawTitle = t || '';
    var st = stateOf(rawTitle);
    if (st && st !== lastState) { lastState = st; notify(st); }
    renderTitle();
  }
  term.onTitleChange(setTitle);
  document.addEventListener('visibilitychange', renderTitle);
  window.addEventListener('focus', renderTitle);

  // --- browser notifications (secure context / https): on this session's state change ---
  function notify(st){
    if(!window.Notification || Notification.permission!=='granted') return;
    if(st!=='done' && st!=='waiting') return;
    try{ var n=new Notification(stripMark(rawTitle) || 'claude-box',{
        body: st==='waiting'?'🟡 waiting for input':'🟢 done', tag:'cb-'+rawTitle });
      n.onclick=function(){ window.focus(); n.close(); };
    }catch(e){}
  }
  function requestNotify(){ try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){} }

  // Deep-link: when entering a session, claude-web-menu sends a private OSC 5379 with its
  // token. We put the token into the address bar as ?id=<token> so the link can be
  // copied/forwarded (open it on a phone -> straight into this session).
  try {
    term.parser.registerOscHandler(5379, function (data) {
      try { history.replaceState(null, '', loc.pathname + '?id=' + encodeURIComponent(data)); } catch (e) {}
      return true;
    });
  } catch (e) { /* old xterm without registerOscHandler — not critical */ }

  // --- Clipboard ------------------------------------------------------------
  // Two paths, both leading to the system clipboard:
  //   1) copy-on-select: Shift+drag selects within xterm itself (bypassing tmux AND an app
  //      in mouse mode, e.g. Claude's fullscreen TUI). On mouse release we copy.
  //   2) OSC 52: tmux (set-clipboard on) sends ESC]52;..;<b64> when copying a selection.
  // KEY POINT: writeText() from an async context (OSC 52 websocket message) is often
  // blocked by browsers — there's no "user gesture". So path (1) copies in the
  // mouseup handler (that's a gesture -> writeText is allowed everywhere), while
  // legacyCopy (execCommand) is the fallback for an insecure context (http access from another device).
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) { /* no way at all — silently */ }
  }
  function copyText(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)['catch'](function () { legacyCopy(text); });
    } else { legacyCopy(text); }   // http not on localhost: clipboard API unavailable
  }
  // (1) copy-on-select: mouse released -> if xterm has a selection, copy it.
  // This is a user gesture, so writeText is not blocked by the browser.
  el.addEventListener('mouseup', function () {
    var sel = term.getSelection && term.getSelection();
    if (sel) copyText(sel);
  });
  // (2) OSC 52 from tmux — we try this too (in Chrome with focus it works even from async).
  try {
    term.parser.registerOscHandler(52, function (data) {
      try {
        var b64 = data.slice(data.indexOf(';') + 1);     // "c;<base64>" / ";<base64>" -> "<base64>"
        if (b64 === '?' || !b64) return true;             // we don't support content queries
        copyText(decodeURIComponent(escape(atob(b64))));  // base64 -> utf8 -> clipboard
      } catch (e) { /* malformed OSC — skip */ }
      return true;
    });
  } catch (e) { /* old xterm — not critical */ }

  // --- sound on BEL (something the ttyd frontend couldn't do): a soft two-note "ding-dong" ---
  var actx = null;
  function tone(freq, t0, dur, peak) {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.02);    // soft attack (no click)
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);   // smooth decay
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime;
      tone(659.25, t,        0.30, 0.16);   // E5
      tone(987.77, t + 0.13, 0.38, 0.16);   // B5 — a pleasant rising interval
    } catch (e) { /* no sound — not critical */ }
  }
  term.onBell(beep);
  // AudioContext only starts after a user gesture — wake it on the first input/tap.
  function wakeAudio() { try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {} requestNotify(); }
  window.addEventListener('pointerdown', wakeAudio);

  // --- connection + reconnect (the session lives in tmux, so reconnecting is safe) ---
  var socket = null, token = '', retry = 0, reconnecting = false;

  function send(bytes) { if (socket && socket.readyState === 1) socket.send(bytes); }

  function connect() {
    fetch(tokenUrl, { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { token: '' }; })
      .catch(function () { return { token: '' }; })
      .then(function (j) { token = (j && j.token) || ''; openSocket(); });
  }

  function openSocket() {
    socket = new WebSocket(wsUrl, ['tty']);
    socket.binaryType = 'arraybuffer';

    socket.onopen = function () {
      retry = 0; reconnecting = false;
      send(enc.encode(JSON.stringify({ AuthToken: token, columns: term.cols, rows: term.rows })));
      term.focus();
    };

    socket.onmessage = function (ev) {
      var data = new Uint8Array(ev.data);
      if (!data.length) return;
      var cmd = String.fromCharCode(data[0]);
      var payload = data.subarray(1);
      if (cmd === SRV.OUTPUT)      term.write(payload);
      else if (cmd === SRV.TITLE)  setTitle(dec.decode(payload));          // our 🟢/🟡/⏳ markers
      else if (cmd === SRV.PREFS)  { /* fontSize/theme if desired */ }
    };

    socket.onclose = function () { reconnect(); };
    socket.onerror = function () { try { socket.close(); } catch (e) {} };
  }

  function reconnect() {
    if (reconnecting) return;
    reconnecting = true; retry++;
    term.writeln('\r\n\x1b[33m[connection lost — reconnecting…]\x1b[0m');
    setTimeout(connect, Math.min(3000, 400 * retry));
  }

  // --- input / resize ---
  term.onData(function (d) { wakeAudio(); send(enc.encode(CLI.INPUT + d)); });

  function syncSize() {
    fit.fit();
    send(enc.encode(CLI.RESIZE + JSON.stringify({ columns: term.cols, rows: term.rows })));
  }
  window.addEventListener('resize', syncSize);
  new ResizeObserver(syncSize).observe(el);

  // --- footer bar: host metrics + session context (polls /metrics) ---
  var bar = document.getElementById('bar');
  function fmtBytes(n) {
    if (n == null) return '—';
    var u = ['B','K','M','G','T'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 || n >= 10 ? Math.round(n) : n.toFixed(1)) + u[i];
  }
  function fmtTok(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
    if (n >= 1e3) return Math.round(n / 1e3) + 'k';
    return String(n);
  }
  function renderMetrics(m) {
    if (!m) { bar.textContent = '—'; return; }
    var parts = [];
    parts.push('load ' + (m.load != null ? m.load.toFixed(2) : '—'));
    var cpuS = 'cpu ' + (m.cpu != null ? m.cpu : '—') + '%';
    parts.push(m.cpu > 85 ? '<span class="hot">' + cpuS + '</span>' : cpuS);
    if (m.mem && m.mem.total) {
      var ramS = 'ram ' + fmtBytes(m.mem.used) + '/' + fmtBytes(m.mem.total);
      parts.push(m.mem.used / m.mem.total > 0.9 ? '<span class="hot">' + ramS + '</span>' : ramS);
    }
    if (m.disk && m.disk.total) {
      parts.push((m.disk.path || 'disk') + ' ' + fmtBytes(m.disk.free));
    }
    if (m.git && m.git.branch) {                    // branch + * if there are uncommitted changes
      parts.push('git ' + m.git.branch + (m.git.dirty ? '*' : ''));
    }
    if (m.ctx) {
      var ctxS = 'ctx ' + fmtTok(m.ctx.used);
      if (m.ctx.max) {                              // denominator/highlight — only if max is set
        ctxS += '/' + fmtTok(m.ctx.max);
        if (m.ctx.used / m.ctx.max > 0.8) ctxS = '<span class="warn">' + ctxS + '</span>';
      }
      if (m.ctx.model) ctxS += ' ' + m.ctx.model.replace(/^claude-/, '');   // model without the prefix
      parts.push(ctxS);
    }
    if (m.spend != null) parts.push('Σ ' + fmtTok(m.spend));   // spend per session (tokens)
    bar.innerHTML = parts.join('  ·  ');
  }
  function pollMetrics() {
    if (document.hidden) return;
    var id = new URLSearchParams(loc.search).get('id') || '';
    fetch('/metrics' + (id ? ('?id=' + encodeURIComponent(id)) : ''), { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(renderMetrics)
      .catch(function () { /* network failure — keep the previous value */ });
  }
  pollMetrics();
  setInterval(pollMetrics, 2000);

  connect();
})();
</script>
</body>
</html>
