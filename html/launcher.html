%2C97.000061l5%2C23.9998779%0D%20L881.999939%2C845L868%2C843l-92-70l-36-31l-80-66.999939h-5V682l18%2C27.000061L771%2C856l5%2C45l-7%2C13.999939L743%2C924l-27-5l-58-80l-59-91%0D%20l-48-81l-5%2C4l-29%2C302l-13%2C15L474.0000305%2C1000z%22%2F%3E%20%3C%2Fg%3E%20%3C%2Fsvg%3E">
<!-- Self-contained: fonts below are inlined as base64 by build-launcher.js at image build
     time (the web sidecar serves this as a single file — no separate /fonts requests). -->
<style>
  @font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
  @font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff2) format("woff2")}
  @font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url(fonts/space-700.woff2) format("woff2")}
  @font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url(fonts/plex-400.woff2) format("woff2")}
  @font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(fonts/plex-600.woff2) format("woff2")}

  :root{
    --paper:#f7f8fa; --panel:#fff; --ink:#0e1116; --body:#1f2430; --slate:#5b6573; --mute:#8a93a2;
    --iris:#5b5bd6; --iris-d:#4848c7; --line:#e6e9ef; --hover:#eceef3; --sel:#e3e5ec; --bubble:#eef0f4;
    --codebg:#f3f4f7; --screen:#0e1116; --screen-line:#262b36; --screen-meta:#8a93a2;
    --live:#16a34a; --wait:#e0a100; --work:#d97757; --stop:#9aa7b8; --err:#c2410c;
    --add:#e7f6ec; --addt:#166534; --del:#fdecea; --delt:#9f1d1d;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    --display:'Space Grotesk',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --side:290px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--panel);color:var(--ink);font:15px/1.6 var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh;height:100dvh}
  .hidden{display:none!important}
  button{font-family:inherit}

  /* ---------- sidebar ---------- */
  #side{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-right:1px solid var(--line);font-size:14px;line-height:1.45}
  .side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
  .brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
  .brand-mark{height:22px;width:22px;flex-shrink:0}
  .brand b{font-family:var(--mono);font-weight:600;color:var(--iris)}
  .iconbtn{background:transparent;border:0;border-radius:8px;color:var(--slate);cursor:pointer;
           width:30px;height:30px;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .iconbtn:hover{background:var(--hover);color:var(--ink)}
  .navbtn{display:flex;align-items:center;gap:10px;margin:0 8px;padding:8px 10px;border:0;border-radius:9px;
          background:transparent;color:var(--ink);font:500 14px var(--sans);cursor:pointer;text-align:left}
  .navbtn:hover{background:var(--hover)}
  .navbtn .ico{width:18px;text-align:center;color:var(--slate);font-size:16px}
  .searchbox{margin:2px 8px 6px;position:relative}
  .searchbox input[type=text]{width:100%;padding:8px 10px 8px 32px;border:1px solid transparent;border-radius:9px;
           background:transparent;font:14px var(--sans);color:var(--ink)}
  .searchbox input[type=text]:hover{background:var(--hover)}
  .searchbox input[type=text]:focus{outline:none;background:var(--panel);border-color:var(--line)}
  .searchbox .ico{position:absolute;left:11px;top:7px;color:var(--slate);pointer-events:none}
  .scope{display:flex;align-items:center;gap:6px;margin:4px 4px 0 10px;color:var(--slate);font-size:12px;cursor:pointer;user-select:none}
  .scope input{accent-color:var(--iris)}
  #list,#results{flex:1;min-height:0;overflow-y:auto;padding:4px 0 16px}
  .grp{display:flex;align-items:center;gap:6px;margin:14px 8px 3px;padding:0 10px;color:var(--slate);
       font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
  .grp .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grp .chev{font-size:10px;transition:transform .15s}
  .grp.closed .chev{transform:rotate(-90deg)}
  .grp .n{margin-left:auto;font-weight:400;color:var(--mute);font-family:var(--mono);font-size:11px}
  .row{position:relative;display:flex;align-items:center;gap:9px;margin:1px 8px;padding:7px 10px;border-radius:9px;
       color:var(--ink);text-decoration:none;cursor:pointer}
  .row:hover{background:var(--hover)}
  .row.active{background:var(--sel)}
  .row .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--stop)}
  .row.live .dot{background:var(--live)}
  .row.wait .dot{background:var(--wait);box-shadow:0 0 0 3px rgba(224,161,0,.18)}
  .row.work .dot{background:var(--work);animation:pulse 1.2s ease-in-out infinite}
  .row.pend .dot{background:var(--iris);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.stop .nm{color:var(--slate)}
  .row .tag{flex:0 0 auto;font:600 10px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 3px}
  .row .when{flex:0 0 auto;color:var(--mute);font-size:11.5px}
  .row .del{display:none;flex:0 0 auto;background:transparent;border:0;border-radius:6px;color:var(--slate);
            font-size:12px;line-height:1;padding:4px 5px;cursor:pointer}
  .row .del:hover{color:var(--work);background:var(--panel)}
  .row:hover .del{display:inline-block}
  .row:hover .when{display:none}
  .empty{color:var(--slate);padding:14px 18px;font-size:13px}
  /* categories */
  .grp.cat{color:var(--ink)}
  .grp .acts{display:none;gap:2px;margin-left:4px}
  .grp:hover .acts{display:inline-flex}
  .grp:hover .n{display:none}
  .grp .acts button{border:0;background:transparent;color:var(--slate);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:5px}
  .grp .acts button:hover{background:var(--panel);color:var(--ink)}
  .drop{margin:2px 8px 4px;padding:8px 10px;border:1px dashed var(--line);border-radius:9px;color:var(--mute);font-size:12.5px}
  .zone.over{outline:2px dashed var(--iris);outline-offset:-2px;border-radius:10px;background:rgba(91,91,214,.06)}
  .row[draggable=true],.grp.cat[draggable=true]{cursor:grab}
  .zone.insb{box-shadow:inset 0 2px 0 var(--iris)} .zone.insa{box-shadow:inset 0 -2px 0 var(--iris)}
  .zone.catdrag{opacity:.45}
  .grp .acts .mv{display:none}
  @media (hover:none){ .grp .acts .mv{display:inline-block} }
  .row.dragging{opacity:.45}
  .row .more{display:none;flex:0 0 auto;background:transparent;border:0;border-radius:6px;color:var(--slate);
             font-size:14px;line-height:1;padding:2px 5px;cursor:pointer}
  .row .more:hover{color:var(--ink);background:var(--panel)}
  .row:hover .more{display:inline-block}
  @media (hover:none){ .row .more{display:inline-block} .grp .acts{display:inline-flex} .grp .n{display:none} }
  .sectlbl{margin:16px 18px 0;color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
           display:flex;align-items:center}
  .sectlbl button{margin-left:auto;border:0;background:transparent;color:var(--slate);cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:5px}
  .sectlbl button:hover{background:var(--hover);color:var(--ink)}
  #menu{position:fixed;z-index:60;display:none;min-width:190px;max-width:260px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;box-shadow:0 12px 32px -12px rgba(20,22,40,.35);padding:5px;font-size:13.5px}
  #menu .mh{padding:5px 9px 3px;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  #menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--ink);
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #menu button:hover{background:var(--hover)}
  #menu button.cur{color:var(--iris);font-weight:600}
  #menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
  .result{display:block;margin:2px 8px;padding:8px 10px;border-radius:9px;cursor:pointer}
  .result:hover{background:var(--hover)}
  .result .name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .result .meta{color:var(--mute);font-size:11.5px;font-weight:400}
  .result .snip{color:var(--slate);font-size:12px;margin-top:2px;word-break:break-word;font-family:var(--mono);
                display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  mark{background:var(--iris);color:#fff;border-radius:3px;padding:0 2px}
  .side-foot{padding:9px 18px 10px;border-top:1px solid var(--line);color:var(--slate);font-family:var(--mono);font-size:11.5px;line-height:1.6}
  .side-foot .ln{display:flex;align-items:center;gap:8px;min-width:0}
  .side-foot #hostm{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-foot .hot{color:var(--err);font-weight:600}
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(22,163,74,.15)}

  /* ---------- main ---------- */
  #main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
  #topbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 16px;border-bottom:1px solid var(--line);font-size:14px}
  #ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  #ttl .cwd{color:var(--mute);font:400 12px var(--mono);margin-left:10px}
  .seg{display:inline-flex;background:var(--hover);border-radius:9px;padding:3px;gap:2px;flex:0 0 auto}
  .seg button{border:0;background:transparent;border-radius:7px;padding:4px 12px;font:500 13px var(--sans);color:var(--slate);cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,17,22,.12)}
  .seg button:disabled{opacity:.45;cursor:default}
  #views{position:relative;flex:1;min-height:0}
  /* Console frames stay laid out at full size (visibility, not display:none), so each xterm keeps
     its real dimensions and switching is instant — no refit, no reconnect, no redraw. */
  #views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;visibility:hidden}
  #views iframe.on{visibility:visible}
  #views .chat{position:absolute;inset:0;display:none;flex-direction:column}
  #views .chat.on{display:flex}
  #blank{position:absolute;inset:0;overflow:auto;padding:48px 20px}
  #blank{padding:32px 24px}
  #blank .inner{max-width:980px;margin:0 auto}
  #blank h2{font:700 22px var(--display);letter-spacing:-.02em;margin:0}
  .fhead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .fhead .root{color:var(--mute);font:12.5px var(--mono)}
  .ftools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .finput{flex:1;min-width:160px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font:14px var(--sans);background:var(--panel);color:var(--ink)}
  .finput:focus{outline:2px solid var(--iris);outline-offset:-1px;border-color:transparent}
  .ftools select{padding:8px 8px;border:1px solid var(--line);border-radius:9px;font:13.5px var(--sans);background:var(--panel);color:var(--ink)}
  .fform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}
  .fform .lbl{font-weight:600;font-size:13.5px;margin-right:4px}
  .job{display:flex;align-items:center;gap:10px;margin:0 0 8px;padding:9px 12px;border-radius:10px;background:var(--paper);font-size:13.5px}
  .job .u{color:var(--mute);font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .job.err{background:var(--del);color:var(--delt)}
  .spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--iris);border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ftable{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .fth,.frow{display:grid;grid-template-columns:28px minmax(0,1fr) 110px 70px 128px 34px;align-items:center;gap:10px;padding:0 12px}
  .fth{height:34px;background:var(--paper);border-bottom:1px solid var(--line);color:var(--mute);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .fth span{cursor:pointer;user-select:none} .fth span.on{color:var(--ink)}
  .frow{min-height:52px;border-bottom:1px solid var(--line);cursor:pointer}
  .frow:last-child{border-bottom:0}
  .frow:hover{background:var(--paper)}
  .frow .ic{color:var(--slate);display:flex;justify-content:center}
  .frow .ic svg{width:18px;height:18px}
  .frow .nm{min-width:0}
  .frow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .nm small{display:block;color:var(--mute);font:11.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .ss,.frow .wh{color:var(--slate);font-size:13px}
  .frow .go{padding:6px 10px;font-size:12.5px;visibility:hidden}
  .frow:hover .go{visibility:visible}
  .frow .more{display:inline-block;background:transparent;border:0;border-radius:6px;color:var(--slate);font-size:15px;cursor:pointer;padding:3px 6px}
  .frow .more:hover{background:var(--hover);color:var(--ink)}
  .frow.root b{color:var(--slate)}
  .fnote{color:var(--mute);font-size:13px;margin:12px 2px 0}
  @media (hover:none){ .frow .go{visibility:visible} }
  @media (max-width:760px){
    #blank{padding:18px 12px}
    .fth{display:none}
    .frow{grid-template-columns:24px minmax(0,1fr) auto 34px}
    .frow .ss,.frow .wh{display:none}
  }
  .linkbtn{background:none;border:0;color:var(--iris);cursor:pointer;padding:0;font:inherit;font-size:13px}
  #menubtn{display:none}
  #scrim{display:none}

  /* ---------- chat ---------- */
  .chat .log{flex:1;min-height:0;overflow-y:auto}
  .chat .inner{max-width:820px;margin:0 auto;padding:24px 24px 32px}
  .msg{margin:14px 0;color:var(--body);word-wrap:break-word}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .b{max-width:85%;background:var(--bubble);border-radius:16px;padding:10px 15px;white-space:pre-wrap}
  .msg.asst > :first-child{margin-top:0} .msg.asst > :last-child{margin-bottom:0}
  .msg.asst p{margin:.55em 0}
  .msg.asst h1,.msg.asst h2,.msg.asst h3,.msg.asst h4{font-family:var(--sans);font-weight:600;line-height:1.3;margin:1.1em 0 .4em}
  .msg.asst h1{font-size:1.3em}.msg.asst h2{font-size:1.18em}.msg.asst h3{font-size:1.06em}.msg.asst h4{font-size:1em}
  .msg.asst ul,.msg.asst ol{padding-left:1.4em;margin:.5em 0} .msg.asst li{margin:.2em 0}
  .msg.asst blockquote{margin:.6em 0;padding-left:12px;border-left:3px solid var(--line);color:var(--slate)}
  .msg.asst a{color:var(--iris)}
  .msg.asst hr{border:0;border-top:1px solid var(--line);margin:1em 0}
  .msg.asst table{border-collapse:collapse;margin:.6em 0;font-size:14px;display:block;overflow-x:auto}
  .msg.asst th,.msg.asst td{border:1px solid var(--line);padding:5px 10px;text-align:left}
  .msg.asst th{background:var(--paper);font-weight:600}
  code{font-family:var(--mono);font-size:.88em;background:var(--codebg);border-radius:5px;padding:.1em .35em}
  pre{font-family:var(--mono);font-size:13px;line-height:1.5;background:var(--codebg);border-radius:10px;padding:12px 14px;
      overflow-x:auto;margin:.7em 0;white-space:pre} pre code{background:none;padding:0;font-size:inherit}
  .msg.live .cursor{display:inline-block;width:8px;height:1em;vertical-align:-2px;background:var(--work);margin-left:2px;animation:pulse 1s infinite}
  .tool{margin:8px 0;font-size:14px}
  .tool > summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;color:var(--slate);padding:2px 0}
  .tool > summary::-webkit-details-marker{display:none}
  .tool > summary .tn{font-weight:600;color:var(--ink);flex:0 0 auto}
  .tool > summary .ts{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tool > summary:before{content:"●";font-size:10px;color:var(--live);flex:0 0 auto;transform:translateY(-1px)}
  .tool.pending > summary:before{color:var(--work);animation:pulse 1s infinite}

<script>
'use strict';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(ts){ if(!ts) return ''; var d=Math.floor(Date.now()/1000)-ts;
  if(d<60) return 'now'; if(d<3600) return Math.floor(d/60)+'m';
  if(d<86400) return Math.floor(d/3600)+'h'; return Math.floor(d/86400)+'d'; }
function base(p){ p=(p||'').replace(/\/+$/,''); return p.slice(p.lastIndexOf('/')+1) || p || '(no folder)'; }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }

// ======================= markdown (small, safe: everything is escaped first) =======================
function mdInline(s){
  var codes=[];
  s=s.replace(/`([^`\n]+)`/g,function(_,c){ codes.push(c); return '\u0000'+(codes.length-1)+'\u0000'; });
  s=esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g,function(_,i){ return '<code>'+esc(codes[+i])+'</code>'; });
}
function md(src){
  var out=[], lines=String(src||'').replace(/\r/g,'').split('\n'), i=0;
  function isTable(j){ return /^\s*\|.*\|\s*$/.test(lines[j]||'') && /^\s*\|[\s:|-]+\|\s*$/.test(lines[j+1]||''); }
  while(i<lines.length){
    var l=lines[i], m;
    if((m=/^\s*```(\S*)/.exec(l))){ var buf=[]; i++;
      while(i<lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]); i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue; }
    if(!l.trim()){ i++; continue; }
    if((m=/^(#{1,6})\s+(.*)$/.exec(l))){ var n=Math.min(4,m[1].length); out.push('<h'+n+'>'+mdInline(m[2])+'</h'+n+'>'); i++; continue; }
    if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(isTable(i)){
      var row=function(t){ return t.trim().replace(/^\||\|$/g,'').split('|').map(function(c){ return mdInline(c.trim()); }); };
      var h='<table><tr>'+row(lines[i]).map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>'; i+=2;
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ h+='<tr>'+row(lines[i]).map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>'; i++; }
      out.push(h+'</table>'); continue; }
    if(/^\s*>/.test(l)){ var q=[]; while(i<lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+md(q.join('\n'))+'</blockquote>'); continue; }
    if((m=/^(\s*)([-*+]|\d+[.)])\s+/.exec(l))){
      var ordered=/\d/.test(m[2]), items=[], cur=null;
      while(i<lines.length){
        var li=lines[i], mm=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(li);
        if(mm && mm[1].length<=m[1].length+1 && /\d/.test(mm[2])===ordered){ cur=[mm[3]]; items.push(cur); i++; continue; }
        if(cur && li.trim() && /^\s{2,}/.test(li)){ cur.push(li.replace(/^\s{2,4}/,'')); i++; continue; }
        if(cur && !li.trim() && /^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i+1]||'')){ i++; continue; }
        break;
      }
      out.push((ordered?'<ol>':'<ul>')+items.map(function(it){
        return '<li>'+(it.length>1?md(it.join('\n')):mdInline(it[0]))+'</li>'; }).join('')+(ordered?'</ol>':'</ul>'));
      continue; }
    var p=[]; while(i<lines.length && lines[i].trim() && !/^\s*```/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) &&
                   !/^\s*>/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) && !isTable(i)) p.push(lines[i++]);
    if(!p.length){ p.push(lines[i++]); }
    out.push('<p>'+p.map(mdInline).join('<br>')+'</p>');
  }
  return out.join('');
}

// ======================= sessions / sidebar state =======================
function statusClass(s){ if(!s.live) return 'stop'; if(s.state==='waiting') return 'wait';
  if(s.state==='working') return 'work'; return 'live'; }
function dispName(s){ var t=(s.title||'').trim(); return t || s.name || s.token; }
function visibleRows(rows){ return rows.filter(function(s){ return !/^\/tmp\/claude-scratch/.test(s.cwd||''); }); }

var ROWS=[], BYTOK={};
var PANES={};          // key (token, or "new-N" until Claude reports the session) -> pane
var ACTIVE=null;       // active pane key; null -> the "new session" page
var CHAT_ON=false;     // web chat available on the server
var MAXCONSOLES=8;     // console iframes kept warm (each holds a websocket + a tmux client)
var newSeq=0;
var CLOSED=JSON.parse(ls('cb.closed')||'{}');
var CATS={cats:[], map:{}};   // sidebar categories (server-side, shared by all devices)
var DRAGGING=false;
var views=$('views');

// ======================= chat transport: one multiplexed websocket =======================
var WS=null, WSOPEN=false, WIRE={}, wsRetry=0;
function wsConnect(){
  if(!CHAT_ON) return;
  var url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+location.pathname.replace(/[^/]*$/,'')+'chat/ws';
  WS=new WebSocket(url);
  WS.onopen=function(){ WSOPEN=true; wsRetry=0;
    Object.keys(WIRE).forEach(function(w){ var p=WIRE[w]; if(p.mode==='chat') openChat(p); }); };
  WS.onmessage=function(e){ var o; try{ o=JSON.parse(e.data); }catch(_){ return; } var p=WIRE[o.key]; if(p) onEvent(p,o); };
  WS.onclose=function(){ WSOPEN=false; setTimeout(wsConnect, Math.min(4000, 300*(++wsRetry))); };
}
function wsSend(o){ if(WSOPEN){ try{ WS.send(JSON.stringify(o)); return true; }catch(_){} } return false; }

// ======================= voice input (Web Speech API) =======================
// Dictation into the composer: final phrases are appended to the textarea, the phrase being
// spoken is shown live in the strip above it. Recognition runs in the browser (Chrome sends audio
// to Google, Safari to Apple) — nothing goes through this server. Needs a secure context (https).
// Mobile browsers misbehave in continuous mode (Android Chrome repeats earlier phrases), so there
// we recognize one phrase at a time and restart until the user stops.
var VOICE=(function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var LANGS=[['ru-RU','RU'],['en-US','EN']];
  var mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var lang=ls('cb.voiceLang')||'ru-RU';
  var V={supported:!!SR, active:null, rec:null, base:'', finals:'', want:false};
  V.label=function(){ for(var i=0;i<LANGS.length;i++) if(LANGS[i][0]===lang) return LANGS[i][1]; return lang; };
  V.cycleLang=function(){
    var i=0; for(;i<LANGS.length;i++) if(LANGS[i][0]===lang) break;
    lang=LANGS[(i+1)%LANGS.length][0]; ls('cb.voiceLang',lang);
    [].forEach.call(document.querySelectorAll('.langbtn'), function(b){ b.textContent=V.label(); });
    if(V.active){ var p=V.active; V.stop(true); V.start(p); }        // restart in the new language
  };
  function show(p, interim){
    var t=p.voiceEl.querySelector('.txt'); t.textContent = interim || 'Listening… ('+V.label()+')';
  }
  function commit(p, interim){
    var txt=(V.finals+(interim?interim:'')).replace(/\s+/g,' ').trim();
    p.ta.value = V.base + (V.base && txt && !/\s$/.test(V.base) ? ' ' : '') + txt;
    p.ta.dispatchEvent(new Event('input'));
  }
  function startRec(p){
    var r=new SR(); V.rec=r;
    r.lang=lang; r.interimResults=true; r.continuous=!mobile; r.maxAlternatives=1;
    r.onresult=function(e){
      var interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var res=e.results[i], t=res[0].transcript;
        if(res.isFinal) V.finals+=(V.finals?' ':'')+t.trim(); else interim+=t;
      }
      commit(p, ''); show(p, interim.trim());
      p.lastInterim=interim.trim();
    };
    r.onerror=function(e){
      if(e.error==='no-speech' || e.error==='aborted') return;
      V.want=false;
      var msg = e.error==='not-allowed' || e.error==='service-not-allowed'
        ? 'Microphone access was denied. Allow it in the browser (it needs https — port 8443 or the tunnel).'
        : (e.error==='network' ? 'Voice recognition needs internet access (the browser uses its cloud recognizer).' : 'Voice input error: '+e.error);
      note(p, esc(msg), true);
    };
    r.onend=function(){
      if(V.rec!==r) return;
      if(V.want && V.active===p){ try{ startRec(p); }catch(_){ finish(p); } return; }   // keep listening

    if(p.lastInterim){ V.finals+=(V.finals?' ':'')+p.lastInterim; p.lastInterim=''; commit(p,''); }

    p.mic.classList.remove('on'); p.voiceEl.classList.remove('on');
  }
  V.start=function(p){
    if(!SR) return;
    if(!window.isSecureContext){ note(p,'Voice input needs https — open the launcher on port 8443 or via the tunnel.',true); return; }
    if(V.active) V.stop(true);
    V.active=p; V.want=true; V.finals=''; V.base=p.ta.value; p.lastInterim='';
    p.mic.classList.add('on'); p.voiceEl.classList.add('on'); show(p,'');
    try{ startRec(p); }catch(e){ finish(p); note(p, esc('Voice input failed to start: '+e.message), true); }
  };

// ======================= panes =======================

function openChat(p){

function send(p){

  var hint=p.inner.querySelector('.note.hint'); if(hint) hint.remove();
  if(!p.firstText) p.firstText=t.replace(/\s+/g,' ').trim().slice(0,80);

function activate(key){

function focusActive(){

function openSession(tok){

// Terminal: bash in the container, one persistent tmux session per folder (see claude-web-menu shell:)

// ---------- mode switching (one owner per session: chat process XOR console tmux) ----------
function toConsole(p){
  if(p.mode==='console' || !p.token) return;
  if((p.state==='running'||p.state==='requires_action') &&
     !confirm('Claude is working in this session. Stop it and switch to the console?')) return;
  if(p.state==='running'||p.state==='requires_action') wsSend({op:'interrupt', key:p.wire});
  p.switching='console'; wsSend({op:'release', key:p.wire}); renderTop();
}
function toChat(p){
  if(p.mode==='chat' || !CHAT_ON) return;
  if(!p.token){ alert('Send a first message in the console so the session gets saved, then switch.'); return; }
  // Drop the frame BEFORE the takeover: a live frame would reconnect and resume the console again.
  dropIframe(p); p.mode='chat'; p.switching='chat';
  if(!p.el) buildChat(p);
  var o={op:'open', key:p.wire, token:p.token}; wsSend(o);
  wsSend({op:'takeover', key:p.wire});
  activate(p.key);
}

// ======================= chat rendering =======================
function nearEnd(p){ return p.log.scrollHeight-p.log.scrollTop-p.log.clientHeight < 80; }

  if(local) p.r.pendingEcho=(p.r.pendingEcho||[]).concat([text.trim()]);

function note(p, html, err){ before(p); p.inner.appendChild(el('div','note'+(err?' err':''), html)); scrollEnd(p); }

function toolSummary(name, inp){
  inp=inp||{};

          inp.description || inp.prompt || inp.skill || '';

  if(!v){ try{ v=JSON.stringify(inp); }catch(e){ v=''; } }

}
function diffHtml(oldS, newS){
  var h='';
  String(oldS||'').split('\n').forEach(function(l){ h+='<div class="d">- '+esc(l)+'</div>'; });
  String(newS||'').split('\n').forEach(function(l){ h+='<div class="a">+ '+esc(l)+'</div>'; });
  return '<pre class="diff">'+h+'</pre>';
}
function toolBody(name, inp){

  if(name==='MultiEdit' && inp.edits) return inp.edits.map(function(e){ return diffHtml(e.old_string,e.new_string); }).join('');
  if(name==='Write') return '<pre>'+esc(String(inp.content||'').slice(0,20000))+'</pre>';
  if(name==='Bash') return '<pre>$ '+esc(inp.command||'')+'</pre>';
  if(name==='TodoWrite' && inp.todos) return '<pre>'+esc(inp.todos.map(function(t){
    return (t.status==='completed'?'☑ ':t.status==='in_progress'?'◐ ':'☐ ')+(t.content||''); }).join('\n'))+'</pre>';
  var j=''; try{ j=JSON.stringify(inp,null,2); }catch(e){}

// Consecutive tool calls (and thinking between them) share one .tgroup, so the "compact" view

function toolGroup(p){

  g.firstChild.addEventListener('click', function(){ g.classList.toggle('open'); });

var TOOLMODES=['compact','all','hidden'], TOOLLBL={compact:'Tools: compact', all:'Tools: all', hidden:'Tools: hidden'};
var toolMode=ls('cb.tools'); if(TOOLMODES.indexOf(toolMode)<0) toolMode='compact';
function applyToolMode(){
  TOOLMODES.forEach(function(m){ document.body.classList.toggle('tools-'+m, m===toolMode); });
  [].forEach.call(document.querySelectorAll('.toolsbtn'), function(b){ b.textContent=TOOLLBL[toolMode]; });
}
function cycleToolMode(){ toolMode=TOOLMODES[(TOOLMODES.indexOf(toolMode)+1)%TOOLMODES.length]; ls('cb.tools',toolMode); applyToolMode(); }
applyToolMode();
function resultText(c){
  if(typeof c==='string') return c;
  if(Array.isArray(c)) return c.map(function(x){ return x.type==='text'?x.text:(x.type==='image'?'[image]':''); }).join('\n');
  return '';
}
function addToolResult(p, b){
  var d=p.r.tools[b.tool_use_id]; if(!d) return;
  d.classList.remove('pending'); if(b.is_error) d.classList.add('err');
  updGroup(d.parentNode && d.parentNode.parentNode);
  var t=resultText(b.content); if(!t) return;
  var body=d.querySelector('.body');
  body.insertAdjacentHTML('beforeend','<div class="lbl">'+(b.is_error?'error':'result')+'</div><pre class="res">'+
    esc(t.length>20000?t.slice(0,20000)+'\n… ('+t.length+' chars)':t)+'</pre>');

// user-side text: hide harness wrappers, show slash commands and local command output
function userTextHtml(p, t){
  var cmd=/<command-name>([\s\S]*?)<\/command-name>/.exec(t);
  if(cmd){ var args=/<command-args>([\s\S]*?)<\/command-args>/.exec(t); addUser(p, cmd[1].trim()+(args&&args[1].trim()?' '+args[1].trim():'')); return; }
  var out=/<local-command-stdout>([\s\S]*?)<\/local-command-stdout>/.exec(t);
  if(out){ if(out[1].trim()) p.inner.appendChild(el('div','note','<pre>'+esc(out[1].trim())+'</pre>')); return; }
  if(/^\s*</.test(t) || /^Caveat:/.test(t)) return;
  // our own optimistic echo arrives back from the SDK — don't print it twice
  var pe=p.r.pendingEcho||[]; var ix=pe.indexOf(t.trim());

function renderItem(p, m){

  var msg=m.message||{}, c=msg.content;
  if(m.type==='user'){
    if(typeof c==='string'){ userTextHtml(p,c); return; }
    (c||[]).forEach(function(b){
      if(b.type==='tool_result') addToolResult(p,b);
      else if(b.type==='text') userTextHtml(p,b.text||'');
      else if(b.type==='image') addUser(p,'[image]');

  }
  if(m.type==='assistant'){
    (Array.isArray(c)?c:[]).forEach(function(b){

        else p.inner.appendChild(el('div','msg asst', md(b.text)));
      } else if(b.type==='tool_use') addTool(p,b);
      else if(b.type==='thinking' && b.thinking){

      }

var rafPending={};
function onStream(p, m){
  if(m.parent_tool_use_id) return;
  var ev=m.event||{};
  if(ev.type==='content_block_start' && ev.content_block && ev.content_block.type==='text'){
    var d=el('div','msg asst live'); d._txt=''; p.inner.appendChild(d); p.r.live.push(d); p.r.cur=d;
  } else if(ev.type==='content_block_delta' && ev.delta && ev.delta.type==='text_delta' && p.r.cur){

  } else if(ev.type==='content_block_stop'){ p.r.cur=null; }

function finishLive(p){ p.r.live.forEach(function(d){ d.classList.remove('live'); d.innerHTML=md(d._txt||''); }); p.r.live=[]; p.r.cur=null; }

function setState(p, st){ p.state=st; renderStatus(p); if(PANES[ACTIVE]===p) renderTop(); }
function renderStatus(p){

  var lbl={running:'working…',starting:'starting…',requires_action:'needs your answer',idle:'ready',stopped:'not running — send a message to resume'}[st]||st;

        var vals=[].slice.call(qd.querySelectorAll('input:checked')).map(function(x){ return x.value; });
        var other=qd.querySelector('input[type=text]').value.trim(); if(other) vals=q.multiSelect?vals.concat([other]):[other];
        ans[q.question]=vals.join(', ');
      });
      msg.answers=ans; msg.allow=true;
    } else { msg.allow=(a==='allow'||a==='always'); msg.always=(a==='always'); }
    wsSend(msg); box.remove();
  });
  p.permsEl.appendChild(box); p.perms[r.id]=box;
}

function renderBanner(p){
  p.banners.innerHTML='';
  if(p.consoleActive){
    var b=el('div','banner','<span>This session is open in the <b>console</b> right now. Chatting here will close the console.</span>');
    var go=el('button','btn','Use chat'); go.type='button';
    go.onclick=function(){ wsSend({op:'takeover', key:p.wire}); };
    var c=el('button','btn ghost','Open console'); c.type='button';
    c.onclick=function(){ p.mode='console'; activate(p.key); };
    b.appendChild(go); b.appendChild(c); p.banners.appendChild(b);
  }
}

function onEvent(p, o){
  switch(o.ev){
    case 'history':
      p.inner.innerHTML=''; p.r={tools:{}, live:[], seen:{}, pendingEcho:[]}; p.permsEl.innerHTML=''; p.perms={};
      (o.items||[]).forEach(function(m){ renderItem(p,m); });
      if(!o.items || !o.items.length) p.inner.appendChild(el('div','note hint', p.token?'(empty session)':'Start the conversation below.'));
      p.info=o.info||{}; p.consoleActive=!!o.console; renderBanner(p);
      (o.perms||[]).forEach(function(r){ renderPerm(p,r); });
      if(o.token && o.token!==p.token) rekey(p,o.token);
      setState(p, o.state||'stopped');
      p.ready=true;
      (p.queue||[]).splice(0).forEach(function(t){ p.ta.value=t; send(p); });
      requestAnimationFrame(function(){ scrollEnd(p,true); });
      break;
    case 'msg':
      before(p);
      var m=o.m;
      if(m.type==='stream_event') onStream(p,m);
      else if(m.type==='result'){
        finishLive(p);
        if(m.subtype && m.subtype!=='success') note(p, esc('Turn ended: '+m.subtype.replace(/_/g,' ')), true);
      } else if(m.type==='system'){
        if(m.subtype==='local_command_output' && m.content) p.inner.appendChild(el('div','note','<pre>'+esc(m.content)+'</pre>'));
        if(m.subtype==='compact_boundary') p.inner.appendChild(el('div','note','— context compacted —'));
      } else renderItem(p,m);
      scrollEnd(p);
      break;
    case 'state': setState(p, o.state); if(o.state==='stopped'||o.state==='idle') finishLive(p); break;
    case 'info': p.info=o.info||{}; renderStatus(p); break;
    case 'token': rekey(p, o.token); break;
    case 'perm': renderPerm(p,o); before(p); scrollEnd(p); break;
    case 'perm_done': if(p.perms[o.id]){ p.perms[o.id].remove(); delete p.perms[o.id]; } break;
    case 'error': note(p, esc(o.text), true); if(p.state==='starting') setState(p,'stopped'); break;
    case 'released':
      if(p.switching==='console'){ p.switching=null; p.mode='console'; activate(p.key); }
      break;
    case 'console':
      p.consoleActive=!!o.active; renderBanner(p); p.switching=null;
      wsSend({op:'open', key:p.wire, token:p.token});   // refresh history written by the console
      break;
  }
}

var LISTSIG='';
var RECENT_SEC=3*86400;
function renderList(force){
  if(DRAGGING) return;                       // a rebuild would cancel the drag in progress
  var rows=ROWS, now=Date.now()/1000;
  var pend=Object.keys(PANES).filter(function(k){ return /^(new-|shell:)/.test(k); });
  var sig=JSON.stringify([ACTIVE,pend,CLOSED,CATS,rows.map(function(s){
    return [s.token,statusClass(s),dispName(s),s.cwd,fmt(s.lastActivity),s.mode]; })]);
  if(!force && sig===LISTSIG) return; LISTSIG=sig;
  var catIds={}; CATS.cats.forEach(function(c){ catIds[c.id]=1; });
  var inCat={}, rest=[];
  rows.forEach(function(s){ var c=CATS.map[s.token];
    if(c && catIds[c]) (inCat[c]=inCat[c]||[]).push(s); else rest.push(s); });
  $('scount').textContent = rows.filter(function(s){return s.live;}).length+' running · '+rows.length+' total';
  var h='';
  pend.forEach(function(k){ var p=PANES[k];
    h+='<div class="row pend'+(k===ACTIVE?' active':'')+'" data-key="'+esc(k)+'"><span class="dot"></span>'+
       '<span class="nm">'+(p.shell?'&gt;_ Terminal':'New session')+(p.cwd?' · '+esc(base(p.cwd)):'')+'</span></div>'; });
  // user categories (in their saved order); members newest first
  h+='<div class="sectlbl">Categories<button type="button" data-act="newcat" title="New category">＋</button></div>';
  if(!CATS.cats.length) h+='<div class="drop zone" data-cat="__new">Drag a session here to create a category</div>';
  CATS.cats.forEach(function(c){
    var arr=(inCat[c.id]||[]).slice().sort(function(a,b){ return (b.lastActivity||0)-(a.lastActivity||0); });
    h+='<div class="zone" data-cat="'+esc(c.id)+'">'+group('c:'+c.id, c.name, c.name, arr, false, c.id)+
       (arr.length||isClosed('c:'+c.id,false)?'':'<div class="drop">Drop sessions here</div>')+'</div>';
  });
  // everything else: by folder, then "Older"
  var recent=rest.filter(function(s){ return s.live || now-(s.lastActivity||0)<RECENT_SEC; });
  var old=rest.filter(function(s){ return !(s.live || now-(s.lastActivity||0)<RECENT_SEC); });
  h+='<div class="zone" data-cat="">';
  if(rest.length) h+='<div class="sectlbl">By folder</div>';
  var groups={}, order=[];
  recent.forEach(function(s){ var k=s.cwd||''; if(!groups[k]){ groups[k]=[]; order.push(k); } groups[k].push(s); });
  order.sort(function(a,b){ return mx(groups[b])-mx(groups[a]); });
  order.forEach(function(k){ h+=group('d:'+k, base(k), k, groups[k]); });
  if(old.length) h+=group('older', 'Older', 'inactive for more than 3 days', old, true);
  if(!rows.length && !pend.length) h+='<div class="empty">No sessions yet — start a new one above.</div>';
  h+='</div>';
  $('list').innerHTML=h;
}
function mx(arr){ return Math.max.apply(null, arr.map(function(s){ return s.lastActivity||0; })); }
function isClosed(id, defClosed){ return (id in CLOSED) ? CLOSED[id] : !!defClosed; }
function group(id, label, tip, arr, defClosed, catId){

  var h='<div class="grp'+(catId?' cat':'')+(closed?' closed':'')+'" data-grp="'+esc(id)+'" title="'+esc(tip)+'"'+

// ---------- categories: storage + actions ----------
function loadCats(){
  return fetch('categories').then(function(r){ return r.ok?r.json():null; }).then(function(o){
    if(o && o.cats){ CATS={cats:o.cats, map:o.map||{}}; renderList(true); } }).catch(function(){});
}
function saveCats(){
  renderList(true);
  fetch('categories',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(CATS)})
    .then(function(r){ return r.ok?r.json():null; }).then(function(o){ if(o&&o.cats){ CATS=o; renderList(true); } })
    .catch(function(){ alert('Failed to save categories'); });
}
function newCategory(thenAssign){
  var name=(prompt('Category name:')||'').trim(); if(!name) return null;
  var id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  CATS.cats.push({id:id, name:name.slice(0,80)});
  if(thenAssign) CATS.map[thenAssign]=id;
  saveCats(); return id;
}
function assign(tok, catId){
  if(catId==='__new'){ newCategory(tok); return; }
  if(catId) CATS.map[tok]=catId; else delete CATS.map[tok];
  saveCats();
}
function renameCategory(id){
  var c=CATS.cats.filter(function(x){ return x.id===id; })[0]; if(!c) return;
  var name=(prompt('Rename category:', c.name)||'').trim(); if(!name) return;
  c.name=name.slice(0,80); saveCats();
}
function deleteCategory(id){
  var c=CATS.cats.filter(function(x){ return x.id===id; })[0]; if(!c) return;
  if(!confirm('Delete category "'+c.name+'"? Its sessions go back to the folder list.')) return;
  CATS.cats=CATS.cats.filter(function(x){ return x.id!==id; });
  Object.keys(CATS.map).forEach(function(k){ if(CATS.map[k]===id) delete CATS.map[k]; });
  saveCats();
}
// Rename a session: written to its transcript as a custom title (same as Claude Code's /rename).
function renameSession(tok){
  var s=BYTOK[tok]; var cur=s?dispName(s):'';
  var name=(prompt('Rename session:', cur)||'').trim(); if(!name || name===cur) return;
  fetch('rename?id='+encodeURIComponent(tok),{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({title:name})})
    .then(function(r){ return r.json(); })
    .then(function(o){
      if(!o.ok){ alert('Rename failed: '+(o.error||'')); return; }
      if(BYTOK[tok]) BYTOK[tok].title=o.title;
      renderList(true); renderTop(); tick();
    }).catch(function(){ alert('Rename failed'); });
}
// Reorder categories: by a step (touch buttons) or to a position (drag and drop).
function moveCategory(id, step){
  var i=CATS.cats.findIndex(function(c){ return c.id===id; }), j=i+step;
  if(i<0 || j<0 || j>=CATS.cats.length) return;
  var c=CATS.cats.splice(i,1)[0]; CATS.cats.splice(j,0,c); saveCats();
}
function placeCategory(id, targetId, after){
  if(id===targetId) return;
  var i=CATS.cats.findIndex(function(c){ return c.id===id; }); if(i<0) return;
  var c=CATS.cats.splice(i,1)[0];
  var j=CATS.cats.findIndex(function(x){ return x.id===targetId; }); if(j<0){ CATS.cats.splice(i,0,c); return; }
  CATS.cats.splice(after?j+1:j, 0, c); saveCats();
}
// keep a session's category when its token changes (new session gets a token, /clear, ...)
function moveCat(oldTok, newTok){ if(CATS.map[oldTok]){ CATS.map[newTok]=CATS.map[oldTok]; delete CATS.map[oldTok]; saveCats(); } }

// ======================= workspace page: folders, new folder, git clone =======================
var WSDATA={root:'', dirs:[], jobs:[]}, FSORT=ls('cb.fsort')||'recent', JOBSEEN={}, AUTOSTART={}, jobTimer=null;
var IC_FOLDER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>';

// sessions in a folder (and its subfolders); for the workspace root only the ones started at the root itself
function sessCount(p){ var root=(p===WSDATA.root);
  return ROWS.filter(function(s){ return s.cwd===p || (!root && (s.cwd||'').indexOf(p+'/')===0); }).length; }
function loadDirs(){

function renderDirs(){
  var q=$('ffilter').value.trim().toLowerCase();
  var ds=WSDATA.dirs.filter(function(d){ return !q || d.name.toLowerCase().indexOf(q)>=0; });
  ds.sort(function(a,b){
    if(FSORT==='name') return a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'});
    if(FSORT==='sessions') return (sessCount(b.path)-sessCount(a.path)) || (b.mtime-a.mtime);
    return b.mtime-a.mtime;
  });
  $('fsort').value=FSORT;
  var h='<div class="fth"><span></span><span data-s="name"'+(FSORT==='name'?' class="on"':'')+'>Name</span>'+
        '<span data-s="sessions"'+(FSORT==='sessions'?' class="on"':'')+'>Sessions</span>'+
        '<span data-s="recent"'+(FSORT==='recent'?' class="on"':'')+'>Modified</span><span></span><span></span></div>';
  if(!q && WSDATA.root) h+=rowHtml({name:'(workspace root)', path:WSDATA.root, mtime:0, git:null}, true);
  ds.forEach(function(d){ h+=rowHtml(d,false); });

  $('dirs').innerHTML=h;
}
function rowHtml(d, isRoot){
  var n=sessCount(d.path), g=d.git, sub='';
  if(g) sub=esc(g.branch||'')+(g.remote?' · '+esc(g.remote.replace(/^(https?:\/\/|ssh:\/\/|git@)/,'').replace(/\.git$/,'')):'');
  return '<div class="frow'+(isRoot?' root':'')+'" data-path="'+esc(d.path)+'" data-name="'+esc(isRoot?'':d.name)+'">'+
    '<span class="ic">'+(g?IC_GIT:IC_FOLDER)+'</span>'+
    '<span class="nm"><b>'+esc(d.name)+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</span>'+
    '<span class="ss">'+(n?n+' session'+(n>1?'s':''):'—')+'</span>'+
    '<span class="wh">'+(d.mtime?fmt(Math.floor(d.mtime/1000)):'')+'</span>'+
    '<button class="btn go" type="button" data-act="start">Start session</button>'+
    (isRoot?'<span></span>':'<button class="more" type="button" data-act="menu" title="More">⋯</button>')+'</div>';
}
function startIn(path){ if(CHAT_ON) newChat(path); else newConsole(); }
$('dirs').addEventListener('click', function(e){
  var th=e.target.closest('.fth span[data-s]');
  if(th){ FSORT=th.getAttribute('data-s'); ls('cb.fsort',FSORT); renderDirs(); return; }
  var row=e.target.closest('.frow'); if(!row) return;
  var act=e.target.closest('[data-act]'), path=row.getAttribute('data-path');
  if(act && act.getAttribute('data-act')==='menu'){ e.stopPropagation(); openFolderMenu(row.getAttribute('data-name'), path, act); return; }
  startIn(path);
});
$('ffilter').addEventListener('input', renderDirs);
$('fsort').addEventListener('change', function(){ FSORT=this.value; ls('cb.fsort',FSORT); renderDirs(); });

// forms
function showForm(id){ ['fnewform','fcloneform'].forEach(function(f){ $(f).classList.toggle('hidden', f!==id || !$(f).classList.contains('hidden')); });
  if(!$(id).classList.contains('hidden')) $(id).querySelector('input').focus(); }
$('fnew').addEventListener('click', function(){ showForm('fnewform'); });
$('fclone').addEventListener('click', function(){ showForm('fcloneform'); });
[].forEach.call(document.querySelectorAll('.fform [data-x]'), function(b){ b.addEventListener('click', function(){ b.closest('form').classList.add('hidden'); }); });
function wsPost(op, body){
  return fetch('workspace/'+op,{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)})
    .then(function(r){ return r.json(); }).then(function(o){ if(!o.ok) throw new Error(o.error||'failed'); return o; });
}
$('fnewform').addEventListener('submit', function(e){
  e.preventDefault(); var name=$('fnewname').value.trim(); if(!name) return;
  wsPost('mkdir',{name:name}).then(function(){ $('fnewname').value=''; $('fnewform').classList.add('hidden'); return loadDirs(); })
    .catch(function(err){ alert('Could not create the folder: '+err.message); });
});
$('fcloneform').addEventListener('submit', function(e){
  e.preventDefault(); var url=$('fcloneurl').value.trim(); if(!url) return;
  wsPost('clone',{url:url, name:$('fclonename').value.trim()}).then(function(o){
    AUTOSTART[o.id]=1;                                   // start a session there once the clone is done
    $('fcloneurl').value=''; $('fclonename').value=''; $('fcloneform').classList.add('hidden');
    return loadDirs();
  }).catch(function(err){ alert('Could not clone: '+err.message); });
});

// clone jobs
function renderJobs(){
  var h='';
  (WSDATA.jobs||[]).forEach(function(j){
    if(j.state==='done' && JOBSEEN[j.id]==='done') return;
    if(j.state==='running') h+='<div class="job"><span class="spin"></span><span>Cloning <b>'+esc(j.name)+'</b>…</span><span class="u">'+esc(j.url)+'</span></div>';
    else if(j.state==='error') h+='<div class="job err"><span>Clone of <b>'+esc(j.name)+'</b> failed: '+esc(j.error)+'</span></div>';
    else h+='<div class="job"><span>✓ Cloned <b>'+esc(j.name)+'</b></span><span class="u"></span>'+
            '<button class="btn" type="button" data-start="'+esc(j.path)+'">Start session</button></div>';
  });
  $('fjobs').innerHTML=h;
  var running=(WSDATA.jobs||[]).some(function(j){ return j.state==='running'; });
  (WSDATA.jobs||[]).forEach(function(j){
    if(j.state==='done' && AUTOSTART[j.id]){ delete AUTOSTART[j.id]; JOBSEEN[j.id]='done'; if(!ACTIVE) startIn(j.path); }
  });
  clearTimeout(jobTimer); if(running) jobTimer=setTimeout(loadDirs, 1500);
}

$('fterm').addEventListener('click', function(){ openShell('/workspace'); });

// folder "⋯" menu (shares the floating #menu with the session rows)
function openFolderMenu(name, path, anchor){
  menuEl.innerHTML='<button type="button" data-fa="start">▸ Start session</button>'+
    '<button type="button" data-fa="term">&gt;_ Open terminal here</button>'+
    '<button type="button" data-fa="rename">✎ Rename…</button><button type="button" data-fa="copy">Copy path</button>';
  menuEl.dataset.mode='folder'; menuEl.dataset.name=name; menuEl.dataset.path=path;
  menuEl.style.display='block';
  var r=anchor.getBoundingClientRect(), w=menuEl.offsetWidth;
  menuEl.style.left=Math.max(8, Math.min(r.right-w, innerWidth-w-8))+'px'; menuEl.style.top=(r.bottom+4)+'px';
}
function folderAction(a, name, path){
  if(a==='start') startIn(path);
  else if(a==='term') openShell(path);
  else if(a==='copy'){ try{ navigator.clipboard.writeText(path); }catch(_){ prompt('Path:', path); } }
  else if(a==='rename'){
    var to=(prompt('Rename folder "'+name+'" to:\n(sessions started in it keep the old path and will not resume there)', name)||'').trim();
    if(!to || to===name) return;
    wsPost('rename',{from:name, to:to}).then(loadDirs).catch(function(err){ alert('Could not rename: '+err.message); });
  }
}

$('newbtn').addEventListener('click', function(){ if(CHAT_ON) showBlank(); else newConsole(); });

// ======================= host metrics in the sidebar footer (same source as the console bar) =======================
function fmtBytes(n){
  if(n==null) return '—'; var u=['B','K','M','G','T'], i=0;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return (i===0||n>=10?Math.round(n):n.toFixed(1))+u[i];
}
function pollHost(){
  if(document.hidden) return;
  fetch('metrics').then(function(r){ return r.ok?r.json():null; }).then(function(m){
    if(!m) return; var parts=[];
    if(m.load!=null) parts.push('load '+Number(m.load).toFixed(2));
    if(m.cpu!=null) parts.push(m.cpu>85?'<span class="hot">cpu '+m.cpu+'%</span>':'cpu '+m.cpu+'%');
    if(m.mem&&m.mem.total){ var r='ram '+fmtBytes(m.mem.used)+'/'+fmtBytes(m.mem.total);
      parts.push(m.mem.used/m.mem.total>0.9?'<span class="hot">'+r+'</span>':r); }
    if(m.disk&&m.disk.total) parts.push(esc(m.disk.path||'disk')+' '+fmtBytes(m.disk.free));
    $('hostm').innerHTML=parts.join(' · ');
  }).catch(function(){});
}
pollHost(); setInterval(pollHost, 5000);

// ======================= polling =======================
function tick(){
  if(document.hidden) return;
  followConsoles();
  fetch('sessions').then(function(r){ return r.ok?r.json():null; }).then(function(rows){
    if(!rows) return;
    ROWS=visibleRows(rows); BYTOK={};
    ROWS.forEach(function(s){ BYTOK[s.token]=s; });
    renderList(); renderTop(); notifyTick(ROWS);
  }).catch(function(){});
}
setInterval(tick, 2000);
setInterval(function(){ if(!document.hidden){ followConsoles(); if(PANES[ACTIVE]&&PANES[ACTIVE].mode==='console') renderTop(); } }, 800);
document.addEventListener('visibilitychange', function(){ if(!document.hidden){ tick(); loadCats(); } });
loadCats();

fetch('chat/info').then(function(r){ return r.ok?r.json():{}; }).catch(function(){ return {}; }).then(function(i){
  CHAT_ON=!!(i&&i.enabled);
  wsConnect();
  var s=new URLSearchParams(location.search).get('s');
  fetch('sessions').then(function(r){ return r.ok?r.json():[]; }).catch(function(){ return []; }).then(function(rows){

    renderList(true);
    if(s) openSession(s); else { showBlank(); if(innerWidth<=760) $('app').classList.add('drawer'); }
  });
});

// ======================= search =======================
(function(){
  var qEl=$('q'), scopeEl=$('scope'), resEl=$('results'), listEl=$('list'), seq=0, tmr=null;
  function hl(text,q){
    var t=text||'', lc=t.toLowerCase(), lq=q.toLowerCase(), out='', i=0, idx;
    if(!lq) return esc(t);
    while((idx=lc.indexOf(lq,i))>=0){ out+=esc(t.slice(i,idx))+'<mark>'+esc(t.slice(idx,idx+q.length))+'</mark>'; i=idx+q.length; }
    return out+esc(t.slice(i));
  }
  function when(ts){ if(!ts) return ''; var d=new Date(ts); return isNaN(d)?'':d.toLocaleString(); }
  function show(on){ resEl.classList.toggle('hidden',!on); listEl.classList.toggle('hidden',on); $('scopewrap').classList.toggle('hidden',!on); }
  function doSearch(){
    var q=qEl.value.trim();
    if(q.length<2){ show(false); resEl.innerHTML=''; return; }
    show(true); resEl.innerHTML='<div class="empty">Searching…</div>';
    var my=++seq, scope=scopeEl.checked?'all':'prompts';
    fetch('search?q='+encodeURIComponent(q)+'&scope='+scope)
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ if(my!==seq) return;
        resEl.innerHTML = rows.length ? rows.map(function(s){
          return '<div class="result" data-key="'+esc(s.token)+'"><div class="name">'+esc(s.name||s.token)+
            ' <span class="meta">'+esc(when(s.timestamp))+(s.type==='assistant'?' · Claude':'')+'</span></div>'+
            '<div class="snip">'+hl(s.snippet||'',q)+'</div></div>'; }).join('') : '<div class="empty">Nothing found.</div>'; })
      .catch(function(){ if(my===seq) resEl.innerHTML='<div class="empty">Search error.</div>'; });
  }
  qEl.addEventListener('input', function(){ clearTimeout(tmr); tmr=setTimeout(doSearch,350); });
  qEl.addEventListener('keydown', function(e){ if(e.key==='Escape'){ qEl.value=''; doSearch(); focusActive(); } });
  scopeEl.addEventListener('change', function(){ if(qEl.value.trim().length>=2) doSearch(); });
  resEl.addEventListener('click', function(e){ var r=e.target.closest('.result'); if(r) openSession(r.getAttribute('data-key')); });
})();

// ======================= notifications for all sessions =======================
document.addEventListener('pointerdown', function once(){
  try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
  document.removeEventListener('pointerdown', once);
});
var NOTIFY_PREV={};
function notifyTick(rows){
  rows.forEach(function(s){
    var st=s.state, was=NOTIFY_PREV[s.token]; NOTIFY_PREV[s.token]=st;
    if(!window.Notification || Notification.permission!=='granted') return;
    if(was===undefined || st===was || (st!=='done' && st!=='waiting')) return;
    if(s.token===ACTIVE && document.hasFocus()) return;
    try{ var n=new Notification('claude-box',{
        body:dispName(s)+': '+(st==='waiting'?'🟡 waiting for input':'🟢 done'), tag:'cb-'+s.token});
      n.onclick=function(){ window.focus(); openSession(s.token); n.close(); };
    }catch(e){}
  });
}
