%2C97.000061l5%2C23.9998779%0D%20L881.999939%2C845L868%2C843l-92-70l-36-31l-80-66.999939h-5V682l18%2C27.000061L771%2C856l5%2C45l-7%2C13.999939L743%2C924l-27-5l-58-80l-59-91%0D%20l-48-81l-5%2C4l-29%2C302l-13%2C15L474.0000305%2C1000z%22%2F%3E%20%3C%2Fg%3E%20%3C%2Fsvg%3E">
<!-- Self-contained: fonts below are inlined as base64 by build-launcher.js at image build
     time (the web sidecar serves this as a single file — no separate /fonts requests). -->
<style>
  @font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
  @font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff2) format("woff2")}
  @font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url(fonts/space-700.woff2) format("woff2")}
  @font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url(fonts/plex-400.woff2) format("woff2")}
  @font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(fonts/plex-600.woff2) format("woff2")}

  :root{
    --paper:#f7f8fa; --panel:#fff; --ink:#0e1116; --slate:#5b6573; --mute:#8a93a2;
    --iris:#5b5bd6; --iris-d:#4848c7; --line:#e6e9ef; --hover:#eceef3; --sel:#e3e5ec;
    --screen:#0e1116; --screen-line:#262b36; --screen-meta:#8a93a2;
    --live:#16a34a; --wait:#e0a100; --work:#d97757; --stop:#9aa7b8;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    --display:'Space Grotesk',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --side:290px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--screen);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh;height:100dvh}
  .hidden{display:none!important}

  /* ---------- sidebar ---------- */
  #side{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-right:1px solid var(--line)}
  .side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
  .brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
  .brand-mark{height:22px;width:22px;flex-shrink:0}
  .brand b{font-family:var(--mono);font-weight:600;color:var(--iris)}
  .iconbtn{background:transparent;border:0;border-radius:8px;color:var(--slate);cursor:pointer;
           width:30px;height:30px;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:var(--hover);color:var(--ink)}

  .navbtn{display:flex;align-items:center;gap:10px;margin:0 8px;padding:8px 10px;border:0;border-radius:9px;
          background:transparent;color:var(--ink);font:500 14px var(--sans);cursor:pointer;text-align:left}
  .navbtn:hover{background:var(--hover)}
  .navbtn .ico{width:18px;text-align:center;color:var(--slate);font-size:16px}
  .searchbox{margin:2px 8px 6px;position:relative}
  .searchbox input[type=text]{width:100%;padding:8px 10px 8px 32px;border:1px solid transparent;border-radius:9px;
           background:transparent;font:14px var(--sans);color:var(--ink)}
  .searchbox input[type=text]:hover{background:var(--hover)}
  .searchbox input[type=text]:focus{outline:none;background:var(--panel);border-color:var(--line)}
  .searchbox .ico{position:absolute;left:11px;top:7px;color:var(--slate);pointer-events:none}
  .scope{display:flex;align-items:center;gap:6px;margin:4px 4px 0 10px;color:var(--slate);font-size:12px;cursor:pointer;user-select:none}
  .scope input{accent-color:var(--iris)}

  #list,#results{flex:1;min-height:0;overflow-y:auto;padding:4px 0 16px}
  .grp{display:flex;align-items:center;gap:6px;margin:14px 8px 3px;padding:0 10px;color:var(--slate);
       font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
  .grp .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grp .chev{font-size:10px;transition:transform .15s}
  .grp.closed .chev{transform:rotate(-90deg)}
  .grp .n{margin-left:auto;font-weight:400;color:var(--mute);font-family:var(--mono);font-size:11px}

  .row{position:relative;display:flex;align-items:center;gap:9px;margin:1px 8px;padding:7px 10px;border-radius:9px;
       color:var(--ink);text-decoration:none;cursor:pointer}
  .row:hover{background:var(--hover)}
  .row.active{background:var(--sel)}
  .row .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--stop)}
  .row.live .dot{background:var(--live)}
  .row.wait .dot{background:var(--wait);box-shadow:0 0 0 3px rgba(224,161,0,.18)}
  .row.work .dot{background:var(--work);animation:pulse 1.2s ease-in-out infinite}
  .row.pend .dot{background:var(--iris);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.stop .nm{color:var(--slate)}
  .row .when{flex:0 0 auto;color:var(--mute);font-size:11.5px}
  .row .open{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--iris);opacity:.7}
  .row .del{display:none;flex:0 0 auto;background:transparent;border:0;border-radius:6px;color:var(--slate);
            font-size:12px;line-height:1;padding:4px 5px;cursor:pointer}
  .row .del:hover{color:var(--work);background:var(--panel)}
  .row:hover .del{display:inline-block}
  .row:hover .when{display:none}
  .empty{color:var(--slate);padding:14px 18px;font-size:13px}

  .result{display:block;margin:2px 8px;padding:8px 10px;border-radius:9px;cursor:pointer}
  .result:hover{background:var(--hover)}
  .result .name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .result .meta{color:var(--mute);font-size:11.5px;font-weight:400}
  .result .snip{color:var(--slate);font-size:12px;margin-top:2px;word-break:break-word;font-family:var(--mono);
                display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  mark{background:var(--iris);color:#fff;border-radius:3px;padding:0 2px}

  .side-foot{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--line);
             color:var(--slate);font-family:var(--mono);font-size:11.5px}
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(22,163,74,.15)}

  /* ---------- main: terminal frames ---------- */
  #main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--screen)}
  #topbar{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;border-bottom:1px solid var(--screen-line);
          color:var(--screen-meta);font:12.5px var(--mono)}
  #topbar .iconbtn{color:var(--screen-meta);width:28px;height:26px;font-size:14px}
  #topbar .iconbtn:hover{background:#1b2029;color:#e7eaf0}
  #ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e7eaf0}
  #ttl .cwd{color:var(--screen-meta);margin-left:8px}
  #frames{position:relative;flex:1;min-height:0}
  /* All frames stay laid out at full size (visibility, not display:none), so each xterm keeps
     its real dimensions and switching is instant — no refit, no reconnect, no redraw. */
  #frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;visibility:hidden}
  #frames iframe.on{visibility:visible}
  #blank{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
         color:var(--screen-meta);font:13px var(--mono);text-align:center;padding:20px}
  #blank .btn{padding:9px 16px;background:var(--iris);border:0;border-radius:10px;color:#fff;font:600 13.5px var(--sans);cursor:pointer}
  #blank .btn:hover{background:var(--iris-d)}
  #menubtn{display:none}
  #scrim{display:none}

  /* ---------- narrow screens: sidebar becomes an overlay drawer ---------- */
  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    #side{position:fixed;z-index:20;left:0;top:0;bottom:0;width:min(86vw,320px);transform:translateX(-100%);
          transition:transform .18s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
    .app.drawer #side{transform:none}
    #menubtn{display:inline-flex}
    #scrim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35)}
    .app.drawer #scrim{display:block}
  }

  </div>
  <button id="newbtn" class="navbtn" type="button"><span class="ico">＋</span>New session</button>

      <button class="btn" type="button" id="blanknew">New session</button></div>

<script>
'use strict';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(ts){ if(!ts) return ''; var d=Math.floor(Date.now()/1000)-ts;
  if(d<60) return 'now'; if(d<3600) return Math.floor(d/60)+'m';
  if(d<86400) return Math.floor(d/3600)+'h'; return Math.floor(d/86400)+'d'; }
function base(p){ p=(p||'').replace(/\/+$/,''); return p.slice(p.lastIndexOf('/')+1) || p || '(no folder)'; }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

// --- session state -> row class ---
//   !live -> stop · waiting -> wait (amber) · working -> work (coral) · done/— -> live (green)
function statusClass(s){ if(!s.live) return 'stop'; if(s.state==='waiting') return 'wait';
  if(s.state==='working') return 'work'; return 'live'; }
// Label: Claude's own session title (same string as the browser tab), else tmux name, else token.
function dispName(s){ var t=(s.title||'').trim(); return t || s.name || s.token; }
// Ephemeral scratch sessions (/tmp/claude-scratch*) are throwaway — keep them off the list.
function visibleRows(rows){ return rows.filter(function(s){ return !/^\/tmp\/claude-scratch/.test(s.cwd||''); }); }

var ROWS=[], BYTOK={};
var FRAMES={};          // key (token, or "new-N" until the session reports its token) -> {iframe, used}
var ACTIVE=null;
var MAXFRAMES=8;        // live terminals kept warm in the background (each holds a websocket)
var pendSeq=0;
var CLOSED=JSON.parse(ls('cb.closed')||'{}');   // collapsed folder groups (per browser)
var framesEl=$('frames');

// ---------- terminal frames ----------
function frameId(f){   // the session token the frame is currently showing (index.html keeps ?id= in sync)
  try{ return new URLSearchParams(f.iframe.contentWindow.location.search).get('id') || ''; }catch(e){ return ''; }
}
function focusActive(){
  var f=FRAMES[ACTIVE]; if(!f) return;
  try{
    var w=f.iframe.contentWindow; w.focus();
    var ta=w.document.querySelector('.xterm-helper-textarea'); if(ta) ta.focus();
  }catch(e){}
}
function evict(){
  var keys=Object.keys(FRAMES); if(keys.length<=MAXFRAMES) return;
  keys.filter(function(k){ return k!==ACTIVE; })
      .sort(function(a,b){ return FRAMES[a].used-FRAMES[b].used; })
      .slice(0, keys.length-MAXFRAMES)
      .forEach(dropFrame);
}
function dropFrame(k){ var f=FRAMES[k]; if(!f) return; f.iframe.remove(); delete FRAMES[k]; if(ACTIVE===k) ACTIVE=null; }

function activate(key, url){
  var f=FRAMES[key];
  if(!f){
    var ifr=document.createElement('iframe');
    ifr.setAttribute('allow','clipboard-read; clipboard-write');
    ifr.src=url;
    ifr.addEventListener('load', function(){ if(ACTIVE===key || FRAMES[ACTIVE]===f) focusActive(); });
    framesEl.appendChild(ifr);
    f=FRAMES[key]={iframe:ifr, used:0};
  }
  f.used=Date.now(); ACTIVE=key;
  Object.keys(FRAMES).forEach(function(k){ FRAMES[k].iframe.classList.toggle('on', k===key); });
  $('blank').classList.add('hidden');
  evict(); syncUrl(); renderList(true); renderTop();
  $('app').classList.remove('drawer');
  setTimeout(focusActive, 0);
}
function openSession(tok){ if(tok) activate(tok, 'term/?id='+encodeURIComponent(tok)); }
function newSession(){ activate('new-'+(++pendSeq), 'term/?new='); }   // Claude names it via its own title

function syncUrl(){
  var q = (ACTIVE && !/^new-/.test(ACTIVE)) ? ('?s='+encodeURIComponent(ACTIVE)) : '';
  try{ history.replaceState(null,'',location.pathname+q); }catch(e){}
}
// A frame's token can change under us: a new session gets its token after the first prompt,
// and /clear starts a new Claude session (new token) in the same tmux pane. Re-key frames.
function rekeyFrames(){
  Object.keys(FRAMES).forEach(function(k){
    var id=frameId(FRAMES[k]);
    if(!id || id===k) return;
    if(FRAMES[id]){ if(ACTIVE===k){ activate(id); } dropFrame(k); return; }
    FRAMES[id]=FRAMES[k]; delete FRAMES[k];
    if(ACTIVE===k){ ACTIVE=id; syncUrl(); }
  });
}

function renderTop(){
  var s=BYTOK[ACTIVE], ttl=$('ttl'), pop=$('popout');
  if(!ACTIVE){ ttl.textContent=''; pop.classList.add('hidden'); document.title='claude-box'; return; }
  var name = s ? dispName(s) : 'New session';
  ttl.innerHTML=esc(name)+(s&&s.cwd?'<span class="cwd">'+esc(s.cwd)+'</span>':'');
  var f=FRAMES[ACTIVE], t='';
  try{ t=f.iframe.contentDocument.title; }catch(e){}
  document.title = t || name;                    // carries the 🟢/🟡/⏳ marker of the active session
  if(!/^new-/.test(ACTIVE)){ pop.href='term/?id='+encodeURIComponent(ACTIVE); pop.classList.remove('hidden'); }
  else pop.classList.add('hidden');
}

// ---------- sidebar list ----------
var LISTSIG='';
function renderList(force){
  var rows=ROWS;
  var pend=Object.keys(FRAMES).filter(function(k){ return !BYTOK[k]; });   // open but not in the registry yet
  var sig=JSON.stringify([ACTIVE,pend,CLOSED,Object.keys(FRAMES).sort(),rows.map(function(s){
    return [s.token,statusClass(s),dispName(s),s.cwd,fmt(s.lastActivity)]; })]);
  if(!force && sig===LISTSIG) return; LISTSIG=sig;

  var live=rows.filter(function(s){ return s.live; }), dead=rows.filter(function(s){ return !s.live; });
  $('scount').textContent = live.length+' running · '+dead.length+' stopped';
  var h='';
  pend.forEach(function(k){
    h+='<div class="row pend'+(k===ACTIVE?' active':'')+'" data-key="'+esc(k)+'"><span class="dot"></span>'+
       '<span class="nm">New session…</span></div>';
  });
  // running sessions grouped by folder; folders ordered by their most recent activity
  var groups={}, order=[];
  live.forEach(function(s){ var k=s.cwd||''; if(!groups[k]){ groups[k]=[]; order.push(k); } groups[k].push(s); });
  order.sort(function(a,b){ return mx(groups[b])-mx(groups[a]); });
  order.forEach(function(k){ h+=group('d:'+k, base(k), k, groups[k]); });
  if(dead.length) h+=group('stopped', 'Stopped', 'click one to resume it', dead, true);
  if(!rows.length && !pend.length) h='<div class="empty">No sessions yet — start a new one above.</div>';
  $('list').innerHTML=h;
}
function mx(arr){ return Math.max.apply(null, arr.map(function(s){ return s.lastActivity||0; })); }
function group(id, label, tip, arr, defClosed){
  var closed = (id in CLOSED) ? CLOSED[id] : !!defClosed;
  var h='<div class="grp'+(closed?' closed':'')+'" data-grp="'+esc(id)+'" title="'+esc(tip)+'">'+
        '<span class="chev">▾</span><span class="nm">'+esc(label)+'</span><span class="n">'+arr.length+'</span></div>';
  if(closed) return h;
  arr.forEach(function(s){
    var cls=statusClass(s), dn=dispName(s);
    h+='<a class="row '+cls+(s.token===ACTIVE?' active':'')+'" href="term/?id='+encodeURIComponent(s.token)+
       '" data-key="'+esc(s.token)+'" title="'+esc(dn+(s.cwd?'\n'+s.cwd:''))+'">'+
       '<span class="dot"></span><span class="nm">'+esc(dn)+'</span>'+
       (FRAMES[s.token]&&s.token!==ACTIVE?'<span class="open" title="open in background"></span>':'')+
       '<span class="when">'+fmt(s.lastActivity)+'</span>'+
       '<button class="del" type="button" title="Delete session" aria-label="Delete session">✕</button></a>';
  });
  return h;
}

$('list').addEventListener('click', function(e){
  var g=e.target.closest('.grp');
  if(g){ var id=g.getAttribute('data-grp'); CLOSED[id]=!g.classList.contains('closed');
         ls('cb.closed', JSON.stringify(CLOSED)); renderList(true); return; }
  var row=e.target.closest('.row'); if(!row) return;
  // keep the normal link behavior for ctrl/cmd/middle click (open in a new tab)
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;
  e.preventDefault();
  var key=row.getAttribute('data-key');
  if(e.target.closest('.del')){ delSession(key); return; }
  if(FRAMES[key]) activate(key); else openSession(key);
});

function delSession(tok){
  var s=BYTOK[tok]; var dn=s?dispName(s):tok;
  if(!confirm('Delete session "'+dn+'"?'+(s&&s.live?' It is running — it will be stopped.':''))) return;
  fetch('delete?id='+encodeURIComponent(tok),{method:'POST'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(p){
      if(!(p&&p.ok)){ alert('Failed to delete session'); return; }
      var wasActive=(ACTIVE===tok); dropFrame(tok);
      if(wasActive){ $('blank').classList.remove('hidden'); syncUrl(); renderTop(); }
      tick();
    }).catch(function(){ alert('Failed to delete session'); });
}

// ---------- polling ----------
function tick(){
  if(document.hidden) return;
  rekeyFrames();
  fetch('sessions').then(function(r){ return r.ok?r.json():null; }).then(function(rows){
    if(!rows) return;
    ROWS=visibleRows(rows); BYTOK={};
    ROWS.forEach(function(s){ BYTOK[s.token]=s; });
    renderList(); renderTop(); notifyTick(ROWS);
  }).catch(function(){ /* keep the current view on a transient failure */ });
}
setInterval(tick, 2000);
setInterval(function(){ if(!document.hidden){ rekeyFrames(); renderTop(); } }, 700);   // title marker follows the terminal
document.addEventListener('visibilitychange', function(){ if(!document.hidden){ tick(); focusActive(); } });

$('newbtn').addEventListener('click', newSession);
$('blanknew').addEventListener('click', newSession);
$('menubtn').addEventListener('click', function(){ $('app').classList.toggle('drawer'); });
$('scrim').addEventListener('click', function(){ $('app').classList.remove('drawer'); });

// initial: reopen the session from ?s=<token> (survives a page reload)
(function(){
  var s=new URLSearchParams(location.search).get('s');
  tick();
  if(s) openSession(s); else { renderList(true); $('app').classList.add('drawer'); }
})();

// ---------- search across the history of all sessions ----------
(function(){
  var qEl=$('q'), scopeEl=$('scope'), resEl=$('results'), listEl=$('list'), seq=0, tmr=null;
  function hl(text,q){
    var t=text||'', lc=t.toLowerCase(), lq=q.toLowerCase(), out='', i=0, idx;
    if(!lq) return esc(t);
    while((idx=lc.indexOf(lq,i))>=0){ out+=esc(t.slice(i,idx))+'<mark>'+esc(t.slice(idx,idx+q.length))+'</mark>'; i=idx+q.length; }
    return out+esc(t.slice(i));
  }
  function when(ts){ if(!ts) return ''; var d=new Date(ts); return isNaN(d)?'':d.toLocaleString(); }
  function show(on){ resEl.classList.toggle('hidden',!on); listEl.classList.toggle('hidden',on); $('scopewrap').classList.toggle('hidden',!on); }
  function renderResults(rows,q){
    if(!rows.length){ resEl.innerHTML='<div class="empty">Nothing found.</div>'; return; }
    var h='';
    rows.forEach(function(s){
      h+='<div class="result" data-key="'+esc(s.token)+'"><div class="name">'+esc(s.name||s.token)+
         ' <span class="meta">'+esc(when(s.timestamp))+(s.type==='assistant'?' · Claude':'')+'</span></div>'+
         '<div class="snip">'+hl(s.snippet||'',q)+'</div></div>';
    });
    resEl.innerHTML=h;
  }
  function doSearch(){
    var q=qEl.value.trim();
    if(q.length<2){ show(false); resEl.innerHTML=''; return; }
    show(true); resEl.innerHTML='<div class="empty">Searching…</div>';
    var my=++seq, scope=scopeEl.checked?'all':'prompts';
    fetch('search?q='+encodeURIComponent(q)+'&scope='+scope)
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ if(my===seq) renderResults(rows,q); })
      .catch(function(){ if(my===seq) resEl.innerHTML='<div class="empty">Search error.</div>'; });
  }
  qEl.addEventListener('input', function(){ clearTimeout(tmr); tmr=setTimeout(doSearch,350); });
  qEl.addEventListener('keydown', function(e){ if(e.key==='Escape'){ qEl.value=''; doSearch(); focusActive(); } });
  scopeEl.addEventListener('change', function(){ if(qEl.value.trim().length>=2) doSearch(); });
  resEl.addEventListener('click', function(e){
    var r=e.target.closest('.result'); if(!r) return;
    var k=r.getAttribute('data-key'); if(FRAMES[k]) activate(k); else openSession(k);
  });
})();

// ---------- notifications for ALL sessions (secure context): on state changes ----------
// The embedded terminals don't notify on their own (see index.html) — only this page does.
document.addEventListener('pointerdown', function once(){
  try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
  document.removeEventListener('pointerdown', once);
});
var NOTIFY_PREV={};
function notifyTick(rows){
  rows.forEach(function(s){
    var st=s.state, was=NOTIFY_PREV[s.token]; NOTIFY_PREV[s.token]=st;
    if(!window.Notification || Notification.permission!=='granted') return;
    if(was===undefined || st===was || (st!=='done' && st!=='waiting')) return;
    if(s.token===ACTIVE && document.hasFocus()) return;     // you're looking at it already
    try{ var n=new Notification('claude-box',{
        body:dispName(s)+': '+(st==='waiting'?'🟡 waiting for input':'🟢 done'), tag:'cb-'+s.token});
      n.onclick=function(){ window.focus(); if(FRAMES[s.token]) activate(s.token); else openSession(s.token); n.close(); };
    }catch(e){}
  });
}
</script></div></body></html>
